<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面走丢了 · CineMax</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css?v=20261125b">
  <style>
    .error-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 8px;
      padding: 40px 24px;
    }
    .error-code {
      font-size: clamp(96px, 18vw, 180px); font-weight: 900; line-height: 0.9;
      letter-spacing: -6px;
      background: linear-gradient(120deg, var(--brand), var(--amber));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .error-page h1 { font-size: 22px; margin-top: 10px; }
    .error-page p { color: var(--muted-2); font-size: 13.5px; max-width: 420px; line-height: 1.9; }
    .error-actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-code">404</div>
    <h1>这一幕不在放映计划里</h1>
    <p>你访问的页面可能已下架、改名，或者链接输入有误。<br>不如回到首页，看看正在热映的影片？</p>
    <div class="error-actions">
      <a class="btn btn-primary btn-lg" href="/index.html">返回首页</a>
      <a class="btn btn-outline btn-lg" href="/index.html#now">正在热映</a>
    </div>
  </main>
</body>
</html>
